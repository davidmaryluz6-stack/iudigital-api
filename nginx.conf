events {}

http {
  resolver 127.0.0.11 valid=10s;

  upstream ms_proyectos_pool {
    zone ms_proyectos_pool 64k;  
    least_conn;
    server ms-proyectos:3001 resolve;
  }

  server {
    listen 80;

    location /health {
      return 200 "ok\n";
    }

    location / {
      proxy_pass http://ms_proyectos_pool;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}